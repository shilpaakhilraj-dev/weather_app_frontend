<div class="flex flex-col items-center justify-start py-12 px-6">
  <div class="w-full max-w-md mb-4">
    <a
      routerLink="/"
      class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-800 transition-colors font-medium cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 1.414L7.414 9H15a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z"
          clip-rule="evenodd"
        />
      </svg>
      Back to Home
    </a>
  </div>

  <div
    class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-md border border-gray-100"
  >
    <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">
      🌤️ Weather App
    </h2>

    <input
      [(ngModel)]="city"
      [disabled]="isLoading"
      placeholder="Enter city name..."
      class="w-full mb-3 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all disabled:opacity-50"
    />

    <select
      [(ngModel)]="units"
      [disabled]="isLoading"
      class="w-full mb-4 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer disabled:opacity-50"
    >
      <option value="metric">Celsius (°C)</option>
      <option value="imperial">Fahrenheit (°F)</option>
    </select>

    <button
      (click)="fetchWeather()"
      [disabled]="isLoading || !city"
      class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 active:scale-[0.98] transition-all shadow-md hover:shadow-lg disabled:bg-blue-400 disabled:cursor-not-allowed flex justify-center items-center gap-2"
    >
      <span *ngIf="!isLoading">Get Weather</span>
      <span *ngIf="isLoading" class="flex items-center gap-2">
        <svg
          class="animate-spin h-5 w-5 text-white"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        Fetching...
      </span>
    </button>

    <div #resultsSection>
      <div *ngIf="isLoading" class="mt-8">
        <div class="flex flex-col items-center mb-6">
          <div
            class="h-6 w-48 bg-gray-200 rounded-full animate-pulse mb-2"
          ></div>
          <div class="h-4 w-24 bg-gray-200 rounded-full animate-pulse"></div>
        </div>

        <div class="space-y-3">
          <div
            *ngFor="let item of [1, 2, 3, 4, 5]"
            class="flex items-center justify-between bg-gray-50 p-4 rounded-xl"
          >
            <div class="h-4 w-28 bg-gray-200 rounded-full animate-pulse"></div>

            <div class="flex items-center gap-4">
              <div class="h-8 w-12 bg-gray-200 rounded-lg animate-pulse"></div>
              <div class="w-px h-8 bg-gray-200"></div>
              <div class="h-8 w-12 bg-gray-200 rounded-lg animate-pulse"></div>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="!isLoading && data" class="mt-8 animate-fade-in">
        <div class="text-center mb-6">
          <h3 class="text-xl font-bold text-gray-800">
            {{ data.city }}, {{ data.country }}
          </h3>
          <p class="text-sm text-gray-500">7-Day Forecast</p>
        </div>

        <div class="space-y-3">
          <div
            *ngFor="let d of data.forecast.time; let i = index"
            class="flex items-center justify-between bg-gray-50 hover:bg-blue-50 p-4 rounded-xl transition-colors duration-200"
          >
            <span class="text-gray-700 font-medium">
              {{ d | date: "EEE, MMM d" }}
            </span>

            <div class="flex items-center gap-4">
              <div class="flex flex-col items-end" title="Maximum Temperature">
                <span
                  class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1"
                  >High</span
                >
                <span class="text-red-500 font-bold flex items-center gap-1">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-3 h-3"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  {{ data.forecast.temperature_2m_max[i] }}°
                </span>
              </div>

              <div class="w-px h-8 bg-gray-200"></div>

              <div
                class="flex flex-col items-start"
                title="Minimum Temperature"
              >
                <span
                  class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1"
                  >Low</span
                >
                <span class="text-blue-500 font-bold flex items-center gap-1">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-3 h-3"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  {{ data.forecast.temperature_2m_min[i] }}°
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
